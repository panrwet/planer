<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Planer</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Planer">
<meta name="theme-color" content="#fcfcfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Habits verfolgen und Todos verwalten – alles lokal auf dem Gerät.">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app">
  <!-- START -->
  <section class="screen" id="screen-home" data-tab="home">
    <header class="topbar">
      <div class="topbar-inner"><h1 class="title" id="home-greeting">Start</h1></div>
      <p class="subtitle" id="home-date"></p>
    </header>
    <div class="scroll" id="home-scroll"></div>
  </section>

  <!-- SUCHE -->
  <section class="screen" id="screen-search" data-tab="home">
    <header class="topbar">
      <div class="topbar-inner">
        <button class="back-btn" id="search-back" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          <span>Start</span>
        </button>
      </div>
      <div class="search-field">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.3-4.3"/></svg>
        <input id="search-input" class="input" type="search" placeholder="Suchen …"
               autocomplete="off" autocapitalize="off" autocorrect="off" enterkeyhint="search"
               aria-label="Suche über Habits, Aufgaben, Listen und Einstellungen">
        <button class="search-clear" id="search-clear" type="button" aria-label="Suche leeren" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </header>
    <div class="scroll" id="search-scroll"></div>
  </section>

  <!-- HABITS -->
  <section class="screen" id="screen-habits" data-tab="habits">
    <header class="topbar">
      <div class="topbar-inner">
        <h1 class="title">Habits</h1>
        <button class="icon-btn primary" id="habit-add" type="button" aria-label="Neues Habit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <p class="subtitle" id="habits-date"></p>
    </header>
    <div class="scroll" id="habits-scroll">
      <div id="habit-groups"></div>
      <div class="empty" id="habits-empty" hidden>
        <div class="empty-icon">✓</div>
        <h2>Noch keine Habits</h2>
        <p>Tippe oben rechts auf <strong>+</strong>, um dein erstes Habit anzulegen.</p>
      </div>
    </div>
  </section>

  <!-- TODOS -->
  <section class="screen" id="screen-todos" data-tab="todos">
    <header class="topbar">
      <div class="topbar-inner">
        <h1 class="title" id="todos-title">Todos</h1>
        <button class="icon-btn primary" id="todo-add" type="button" aria-label="Neue Aufgabe">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <p class="subtitle" id="todos-subtitle"></p>
    </header>
    <div class="scroll" id="todos-scroll">
      <div class="list" id="todo-list"></div>
      <div id="todos-done"></div>
      <div class="empty" id="todos-empty" hidden>
        <div class="empty-icon">✓</div>
        <h2>Nichts offen</h2>
        <p id="todos-empty-text">Tippe oben rechts auf + für eine neue Aufgabe.</p>
      </div>
    </div>
  </section>

  <!-- HABIT DETAIL -->
  <section class="screen" id="screen-detail" data-tab="habits">
    <header class="topbar">
      <div class="topbar-inner">
        <button class="back-btn" id="detail-back" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          <span>Habits</span>
        </button>
        <button class="icon-btn" id="detail-edit" type="button" aria-label="Habit bearbeiten">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 10-4-4L4 16v4z"/></svg>
        </button>
      </div>
    </header>
    <div class="scroll" id="detail-scroll"></div>
  </section>

  <!-- EINSTELLUNGEN -->
  <section class="screen" id="screen-settings" data-tab="home">
    <header class="topbar">
      <div class="topbar-inner">
        <button class="back-btn" id="settings-back" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          <span>Start</span>
        </button>
      </div>
      <h1 class="title">Einstellungen</h1>
    </header>
    <div class="scroll" id="settings-scroll"></div>
  </section>

  <nav class="listbar" id="listbar" aria-label="Listen" hidden>
    <div class="list-tabs" id="list-tabs"></div>
    <button class="listbar-more" id="list-menu" type="button" aria-label="Listen und Einstellungen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
    </button>
  </nav>

  <nav class="tabbar" id="tabbar" aria-label="Hauptbereiche">
    <button class="tab" data-goto="home" type="button" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg>
      <span>Start</span>
    </button>
    <button class="tab" data-goto="habits" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
      <span>Habits</span>
    </button>
    <button class="tab" data-goto="todos" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
      <span>Todos</span>
    </button>
  </nav>
</div>

<div class="dropup-host" id="dropup-host" hidden></div>
<div class="sheet-host" id="sheet-host" hidden></div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
